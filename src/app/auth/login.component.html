<div class="auth-page">
  <app-auth-marca></app-auth-marca>

  <main class="auth-form-panel">
    <div class="auth-card">
      <h1>Bienvenido de nuevo</h1>
      <p class="auth-sub">Inicia sesión para gestionar tu cartera.</p>

      @if (aviso) {
        <div class="alert alert-info">{{ aviso }}</div>
      }
      @if (error) {
        <div class="alert alert-error" role="alert">{{ error }}</div>
      }

      <form (ngSubmit)="ingresar()" novalidate>
        <div class="campo">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="tucorreo@empresa.com"
                 [(ngModel)]="email" required />
        </div>

        <div class="campo campo-clave">
          <label for="password">Contraseña</label>
          <input id="password" name="password" [type]="verClave ? 'text' : 'password'"
                 autocomplete="current-password" placeholder="••••••••" [(ngModel)]="password" required />
          <button type="button" class="ver-clave" (click)="verClave = !verClave">
            {{ verClave ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>

        <button type="submit" class="btn btn-primary btn-block" [disabled]="enviando">
          @if (enviando) { <span class="spinner"></span> Ingresando… } @else { Iniciar sesión }
        </button>
      </form>

      <p class="auth-enlace">¿Aún no tienes cuenta? <a routerLink="/registro">Crear cuenta</a></p>

      @if (mostrarDemo) {
        <p class="auth-demo">Demo local: <b>admin&#64;cobro.com</b> / <b>Admin123*</b></p>
      }
    </div>
  </main>
</div>
