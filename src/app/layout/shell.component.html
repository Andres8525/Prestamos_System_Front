<div class="shell" [class.menu-abierto]="menuMovil">
  <app-nav-menu class="shell-lateral" (collapsedChange)="colapsado = $event" (navegar)="menuMovil = false"></app-nav-menu>
  <div class="shell-velo" (click)="menuMovil = false"></div>

  <div class="shell-cuerpo">
    <header class="topbar">
      <button class="topbar-hamburguesa" (click)="menuMovil = !menuMovil" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>

      <div class="topbar-saludo">
        <strong>{{ saludo }}, {{ primerNombre }} 👋</strong>
        <small>{{ fecha }}</small>
      </div>

      <div class="topbar-acciones">
        <div class="usuario" [class.abierto]="menuUsuario">
          <button class="usuario-boton" (click)="menuUsuario = !menuUsuario" aria-haspopup="menu" [attr.aria-expanded]="menuUsuario">
            <span class="avatar">{{ iniciales }}</span>
            <span class="usuario-datos">
              <b>{{ auth.usuario?.nombre }}</b>
              <small>{{ auth.usuario?.email }}</small>
            </span>
            <svg class="flecha" viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M7 10l5 5 5-5z"/></svg>
          </button>

          @if (menuUsuario) {
            <div class="usuario-velo" (click)="menuUsuario = false"></div>
            <div class="usuario-menu" role="menu">
              <div class="usuario-menu-cabecera">
                <span class="avatar grande">{{ iniciales }}</span>
                <div>
                  <b>{{ auth.usuario?.nombre }}</b>
                  <small>{{ auth.usuario?.email }}</small>
                </div>
              </div>
              <button class="usuario-menu-item peligro" role="menuitem" (click)="cerrarSesion()">
                <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                Cerrar sesión
              </button>
            </div>
          }
        </div>
      </div>
    </header>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
