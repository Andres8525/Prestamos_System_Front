<div class="shell" [class.menu-abierto]="menuMovil">
  <app-nav-menu class="shell-lateral" (collapsedChange)="colapsado = $event" (navegar)="menuMovil = false"></app-nav-menu>
  <div class="shell-velo" (click)="menuMovil = false"></div>

  <div class="shell-cuerpo">
    <header class="topbar">
      <button class="topbar-hamburguesa" (click)="menuMovil = !menuMovil" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>

      <div class="topbar-saludo">
        <strong>{{ saludo }}, {{ primerNombre }} 👋</strong>
        <small>{{ fecha }}</small>
      </div>

      <div class="topbar-acciones">
        <span class="en-vivo" [ngClass]="estadoTiempoReal" [title]="'Eventos en tiempo real: ' + textoTiempoReal" aria-live="polite">
          <i></i><span>{{ textoTiempoReal }}</span>
        </span>
        <button class="tema-boton" (click)="temas.siguiente()" [title]="temas.etiqueta + ' (clic para cambiar)'" [attr.aria-label]="temas.etiqueta">
          @switch (temas.tema) {
            @case ('oscuro') { <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 01-4.4 2.26 5.4 5.4 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg> }
            @case ('claro') { <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M12 7a5 5 0 100 10 5 5 0 000-10zM2 13h2a1 1 0 000-2H2a1 1 0 000 2zm18 0h2a1 1 0 000-2h-2a1 1 0 000 2zM11 2v2a1 1 0 002 0V2a1 1 0 00-2 0zm0 18v2a1 1 0 002 0v-2a1 1 0 00-2 0zM5.99 4.58a1 1 0 00-1.41 1.41l1.06 1.06a1 1 0 001.41-1.41L5.99 4.58zm12.37 12.37a1 1 0 00-1.41 1.41l1.06 1.06a1 1 0 001.41-1.41l-1.06-1.06zm1.06-10.96a1 1 0 00-1.41-1.41l-1.06 1.06a1 1 0 001.41 1.41l1.06-1.06zM7.05 18.36a1 1 0 00-1.41-1.41l-1.06 1.06a1 1 0 001.41 1.41l1.06-1.06z"/></svg> }
            @default { <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 18V4a8 8 0 010 16z"/></svg> }
          }
        </button>
        <div class="usuario" [class.abierto]="menuUsuario">
          <button class="usuario-boton" (click)="menuUsuario = !menuUsuario" aria-haspopup="menu" [attr.aria-expanded]="menuUsuario">
            <span class="avatar">{{ iniciales }}</span>
            <span class="usuario-datos">
              <b>{{ auth.usuario?.nombre }}</b>
              <small>{{ auth.usuario?.email }}</small>
            </span>
            <svg class="flecha" viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M7 10l5 5 5-5z"/></svg>
          </button>

          @if (menuUsuario) {
            <div class="usuario-velo" (click)="menuUsuario = false"></div>
            <div class="usuario-menu" role="menu">
              <div class="usuario-menu-cabecera">
                <span class="avatar grande">{{ iniciales }}</span>
                <div>
                  <b>{{ auth.usuario?.nombre }}</b>
                  <small>{{ auth.usuario?.email }}</small>
                </div>
              </div>
              <button class="usuario-menu-item peligro" role="menuitem" (click)="cerrarSesion()">
                <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                Cerrar sesión
              </button>
            </div>
          }
        </div>
      </div>
    </header>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
