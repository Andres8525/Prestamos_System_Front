<nav class="nav-menu" [class.collapsed]="isCollapsed" aria-label="Menú principal">
  <div class="nav-header">
    <div class="nav-marca">
      <img src="favicon.svg" alt="" class="nav-logo" />
      @if (!isCollapsed) {
        <span class="nav-title">CrediRuta</span>
      }
    </div>
    <button class="toggle-btn" (click)="toggle()" [title]="isCollapsed ? 'Expandir menú' : 'Contraer menú'"
            [attr.aria-label]="isCollapsed ? 'Expandir menú' : 'Contraer menú'">
      <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18" [class.girado]="isCollapsed">
        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
      </svg>
    </button>
  </div>

  <div class="nav-items" (click)="navegar.emit()">
    @for (seccion of secciones; track seccion.titulo) {
      @if (!isCollapsed) {
        <p class="nav-seccion">{{ seccion.titulo }}</p>
      } @else {
        <span class="nav-separador"></span>
      }
      @for (item of seccion.items; track item.route) {
        <app-menu-item [item]="item" [collapsed]="isCollapsed"></app-menu-item>
      }
    }
  </div>

  <div class="nav-footer">
    <button class="salir-btn" (click)="cerrarSesion()" [title]="isCollapsed ? 'Cerrar sesión' : ''">
      <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
        <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
      </svg>
      @if (!isCollapsed) {
        <span>Cerrar sesión</span>
      }
    </button>
  </div>
</nav>
